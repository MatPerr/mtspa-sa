[project]
name = "mtspa-sa"
version = "0.1.0"
description = "A minimal simulated annealing example for multi-agent routing"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pyyaml>=6.0.3",
    "tqdm>=4.70.1",
]

[project.scripts]
mtspa-sa = "mtspa_sa.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mtspa_sa"]

[tool.hatch.build.targets.wheel.force-include]
"loss_config.yaml" = "mtspa_sa/loss_config.yaml"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]
